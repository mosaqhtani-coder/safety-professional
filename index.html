<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة محترف السلامة</title>
<meta name="theme-color" content="#0f766e">

<style>
:root{--bg:#f5f1e8;--surface:#fffdf8;--surface2:#efe9da;--ink:#1c2929;--muted:#5b6965;--line:#ddd5c2;--accent:#0f766e;--accent-ink:#ffffff;--good:#15803d;--good-bg:#dcf2e1;--bad:#b91c1c;--bad-bg:#fbe3e0;--warn:#b45309;--warn-bg:#fbeccd;--shadow:0 1px 2px rgba(40,30,10,.08),0 6px 18px rgba(40,30,10,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1818;--surface:#172323;--surface2:#1f2f2f;--ink:#e9f0ee;--muted:#9db0ab;--line:#2c3d3c;--accent:#5eead4;--accent-ink:#06201c;--good:#6ee7a0;--good-bg:#12331f;--bad:#fca5a5;--bad-bg:#3a1717;--warn:#fcd34d;--warn-bg:#3a2d0c;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1818;--surface:#172323;--surface2:#1f2f2f;--ink:#e9f0ee;--muted:#9db0ab;--line:#2c3d3c;--accent:#5eead4;--accent-ink:#06201c;--good:#6ee7a0;--good-bg:#12331f;--bad:#fca5a5;--bad-bg:#3a1717;--warn:#fcd34d;--warn-bg:#3a2d0c;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.8 "IBM Plex Sans Arabic",Tahoma,sans-serif;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:700;line-height:1.4;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:1.35rem}
.brand small{color:var(--muted);font-size:.8rem}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
nav button,.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:500;transition:.15s}
nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav button:hover,.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:3px 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{padding-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.muted{color:var(--muted)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;font-size:.82rem;background:var(--surface2)}
.badge{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600}
.b-ext{background:var(--warn-bg);color:var(--warn)}
.b-part{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;min-width:60px;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* map */
.maptools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.mapwrap{overflow:auto;direction:ltr;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-height:calc(100vh - 230px);min-height:360px}
.canvas{position:relative}
.canvas svg{position:absolute;inset:0;pointer-events:none}
.canvas path{fill:none;stroke:var(--line);stroke-width:2}
.node{position:absolute;direction:rtl;text-align:right;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;line-height:1.45;font-size:.92rem;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.node:hover,.node:focus-visible{border-color:var(--accent);outline:2px solid transparent}
.node.root{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:"Reem Kufi",sans-serif;font-size:1.05rem;justify-content:center;text-align:center}
.node.unit{border-width:2px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.dot.s-good{background:var(--good)}.dot.s-mid{background:var(--warn)}.dot.s-bad{background:var(--bad)}
.node .tk{color:var(--good);font-weight:700;flex:none}
.node span.t{flex:1;min-width:0}
.node .tg{flex:none;color:var(--muted);font-size:.85rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
/* panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.panel{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(520px,100%);background:var(--surface);z-index:50;overflow:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 40px;border-inline-end:1px solid var(--line);box-shadow:var(--shadow)}
.panel h2{font-size:1.3rem;margin:6px 0}
.panel h3{font-size:1rem;margin:16px 0 4px;color:var(--accent)}
.panel ul{margin:4px 0;padding-inline-start:20px}
.panel .en{direction:ltr;unicode-bidi:isolate}
.terms{width:100%;border-collapse:collapse;font-size:.92rem}
.terms td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
.terms td:first-child{direction:ltr;text-align:left;font-weight:600;white-space:nowrap}
.tbl{overflow-x:auto}
/* learn */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:6px}
.side h3{font-size:.95rem;margin-top:10px}
.titem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;text-align:right;width:100%}
.titem[aria-current="true"]{border-color:var(--accent);background:var(--surface2)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;font-size:.85rem}
.steps button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lesson h2{font-size:1.4rem;margin-bottom:6px}
.lesson p{max-width:68ch}
.callout{border-inline-start:4px solid var(--accent);background:var(--surface2);padding:10px 14px;border-radius:8px;margin:10px 0}
/* quiz */
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;text-align:right}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:12px;padding:12px 16px;margin-top:12px}
.fb.ok{background:var(--good-bg);border:1px solid var(--good)}
.fb.no{background:var(--bad-bg);border:1px solid var(--bad)}
.fb b.h{display:block}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
textarea{min-height:110px}
.ordl{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.ordl li{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface)}
.ordl li span{flex:1}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.85rem}
.qtext{font-size:1.12rem;font-weight:500;margin:10px 0}
.big{font-family:"Reem Kufi",sans-serif;font-size:2.6rem;line-height:1.2}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.sbtn{display:flex;gap:6px;align-items:center}
.note{font-size:.85rem;color:var(--muted)}
.model{white-space:pre-line;margin-top:6px}
.examcard{border-inline-start:5px solid var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="top">
  <div class="brand"><h1>منصة محترف السلامة والصحة المهنية</h1><small>خمس وحدات — خريطة تفاعلية، شرح، محاكاة الاختبار المقالي، ومراجعة ذكية</small></div>
  <button class="btn sm" data-a="theme" id="themeBtn">الوضع الداكن</button>
 </div>
 <nav id="nav">
  <button data-tab="map">الخريطة الذهنية</button>
  <button data-tab="learn">تعلم وافهم</button>
  <button data-tab="quiz">اختبر نفسك</button>
  <button data-tab="review">راجع نقاط ضعفك</button>
  <button data-tab="dash">تقدمي</button>
 </nav>
</header>
<main id="main"></main>
</div>

{"id":"e101","tp":"u1p1","t":"short","d":3,"ex":1,"wc":75,"q":"اشرح بإيجاز نظرية هاينريش (الدومينو) ونظرية هرم الحوادث.","model":"الدومينو: الإصابة نتيجة سلسلة من خمسة عوامل متتابعة: الأسلاف والبيئة الاجتماعية، خطأ الشخص، التصرف غير الآمن أو الخطر، الحادث، ثم الإصابة. إزالة أحد العوامل، وغالبًا التصرف غير الآمن، تمنع الحادث. عيبها أنها أحادية الأبعاد.\nهرم الحوادث: علاقة بين الحوادث الخطيرة والصغيرة والتصرفات غير الآمنة: وفاة واحدة يقابلها نحو 10 إصابات خطيرة و30 خفيفة و600 حادث وشيك و300 ألف تصرف غير آمن. تقليل القاعدة يقلل القمة، لذلك نهتم بالإبلاغ عن الحوادث الوشيكة.","keys":[["سلسله","متتابع","عوامل"],["تصرف غير","فعل غير","غير الامن","غير امن"],["ازاله","ازلنا","منع"],["هرم"],["وشيك","شبه"],["احاديه","قاعده","600","تقليل"]],"e":"","src":"جامع أسئلة الدفعتين 5 و6، تجميعة الأسئلة المتكررة"},
{"id":"e102","tp":"u1p3","t":"short","d":3,"ex":1,"wc":75,"q":"اشرح دورة ديمنغ وحدد ما تغطيه كل خطوة عند بناء نظام إدارة السلامة والصحة المهنية.","model":"دورة ديمنغ نموذج تكراري للتحسين المستمر من أربع مراحل:\nخطّط: السياسة والأهداف، الأدوار والمسؤوليات، المتطلبات القانونية، خطط التدريب والطوارئ.\nنفّذ: ضوابط التشغيل، إدارة المخاطر، إدارة التغيير والطوارئ.\nتحقّق: الرصد والقياس، التدقيق، مراجعة الامتثال، التحقيق في الحوادث.\nصحّح: مراجعة النظام، تنفيذ الإجراءات التصحيحية، تعزيز الإيجابيات.\nتُعاد الدورة باستمرار. إيجابياتها أنها بسيطة وتصلح لكل الأنظمة، وسلبياتها أنها بطيئة وتتطلب التزام الإدارة العليا.","keys":[["خطط","تخطيط"],["نفذ","تنفيذ"],["تحقق","حقق","افحص","فحص"],["صحح","تصحيح","حسن"],["تحسين المستمر","مستمر","تكرار"],["سياسه","اهداف"],["تدقيق","قياس","رصد"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e103","tp":"u1p3","t":"short","d":3,"ex":1,"wc":75,"q":"حدد بعض معايير ISO مع تبيين المجال الخاص بكل منها.","model":"ISO 45001: نظام إدارة السلامة والصحة المهنية.\nISO 14001: نظام الإدارة البيئية والتحكم في المخاطر البيئية.\nISO 9001: نظام إدارة الجودة ورضا العملاء.\nISO 19011: إرشادات تدقيق أنظمة الإدارة.\nتشترك كلها في منهج التحسين المستمر (دورة ديمنغ) والوصول بالمنشأة لأفضل أداء.","keys":[["45001"],["14001"],["9001"],["19011"],["بيئ"],["جوده"],["تدقيق"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)"},
{"id":"e104","tp":"u1p3","t":"short","d":3,"ex":1,"wc":75,"q":"ينبغي أن تتسم أهداف السلامة بسمات SMART. اشرحها وأعطِ ثلاثة أمثلة.","model":"الهدف الذكي: محدد وواضح، قابل للقياس، قابل للإنجاز بالموارد المتاحة، واقعي وذو صلة، محدد بوقت.\nأمثلة:\n1) خفض نسبة الإصابات 10% خلال السنة القادمة مقارنة بالسنة الماضية.\n2) إجراء فحص طبي لجميع عمال اللحام خلال أسبوعين.\n3) تدريب جميع العاملين على المرتفعات على العمل الآمن خلال شهر.\nويُحدد لكل هدف مسؤول وموارد وطريقة لقياس الإنجاز.","keys":[["محدد"],["قياس"],["انجاز","تحقيق"],["واقعي","صله"],["وقت","زمن"],["خلال","شهر","سنه","اسبوع"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e105","tp":"u1p2","t":"short","d":3,"ex":1,"wc":75,"q":"اشرح مؤشرات الأداء الرائدة (النشطة) والناتجة (التفاعلية) مع مثال لكل نوع.","model":"مؤشرات الأداء تضعها المنشأة لمعرفة أدائها في السلامة، وتعتمد على جمع البيانات، وهي كمية ونوعية.\nالرائدة (الاستباقية): تقيس الجهد الوقائي قبل وقوع الحادث، مثل عدد الجولات التفتيشية وساعات التدريب والفحوصات الطبية والبلاغات. تعالج الضعف مبكرًا لكن جمعها يستهلك وقتًا.\nالناتجة (المتأخرة): تقيس النتائج بعد وقوعها، مثل عدد الإصابات والحوادث والأمراض المهنية. سهلة الجمع وتفيد في المقارنة المعيارية، لكن قلة الإصابات قد تكون بسبب عدم الإبلاغ.","keys":[["رائده","استباقي","نشطه"],["ناتجه","متاخره","لاحق","تفاعلي"],["تدريب","تفتيش","فحوص","جولات"],["اصابات","حوادث","امراض"],["قبل"],["بعد"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e106","tp":"u1p3","t":"short","d":3,"ex":1,"wc":75,"q":"لماذا تقوم المنشآت بالمقارنة المعيارية للسلامة والصحة المهنية؟","model":"المقارنة المعيارية عملية مدروسة ومخططة تقارن بها المنشأة عملياتها وأداءها بمنشآت أخرى ذات مستوى عالٍ، أو بين أقسامها.\nأهدافها: الحد من الحوادث والإصابات والأمراض المهنية، تطبيق أفضل الممارسات، معرفة نقاط القوة والضعف في النظام، الامتثال للمتطلبات، تبادل الخبرات والدروس المستفادة من التحقيق في الحوادث، تعزيز السمعة، والتحسين المستمر.\nوتحتاج بيانات حديثة وعالية الجودة.","keys":[["مقارنه","تقارن"],["افضل الممارسات"],["قوه","ضعف"],["حوادث","اصابات"],["خبرات","دروس"],["تحسين"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e107","tp":"u1p4","t":"short","d":3,"ex":1,"wc":75,"q":"عرّف الحوكمة واذكر عناصرها، ووضّح الفرق بينها وبين الإدارة.","model":"الحوكمة: النظام الذي يجري من خلاله توجيه المنشآت والسيطرة عليها من جانب مجلس إدارتها.\nعناصرها: قيادة الأعمال وتأسيس الاتجاه الاستراتيجي العام، تحديد القيم والمعايير والأهداف، محاسبة الإدارة على أدائها، الإشراف على الضوابط الداخلية.\nالإدارة: تركز على القرارات والإجراءات اليومية لتشغيل الأعمال بما يتماشى مع التوجيه الذي حدده المجلس.\nفالحوكمة توجّه وتراقب، والإدارة تنفّذ.","keys":[["توجيه","سيطره"],["مجلس"],["استراتيجي","قياده"],["قيم","معايير","اهداف"],["محاسبه","مساءله"],["ضوابط الداخليه","اشراف"],["يوميه","تنفيذ","تشغيل"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e108","tp":"u1p1","t":"short","d":3,"ex":1,"wc":75,"q":"ما الفرق بين نموذج الجبن السويسري ونظرية الدومينو؟","model":"الجبن السويسري: الحوادث نتيجة سلسلة من الأسباب تشمل الخطأ البشري والإداري والهندسي. الشرائح هي التدابير الوقائية، والثقوب نقاط الضعف فيها، ويقع الحادث عند اصطفاف الثقوب. هي نظرية متعددة الأسباب تجمع الإخفاقات النشطة (تصرف غير آمن) والكامنة (خطأ في التصميم أو الإجراءات).\nالدومينو: الإصابة تنتج عن سلسلة خطية من خمسة عوامل آخرها الحادث، وتركز على التصرف غير الآمن والخطأ البشري؛ فهي أحادية الأبعاد ولا تحدد السبب الرئيسي في كثير من الحالات.","keys":[["شرائح","طبقات","تدابير","دفاع"],["ثقوب","ثغرات","فراغات","ضعف"],["متعدده","اسباب"],["احاديه","خطيه","سلسله"],["نشط","كامن"],["بشري","تصرف غير"]],"e":"","src":"تجميعة الأسئلة المتكررة"},
{"id":"e109","tp":"u1p1","t":"short","d":3,"ex":1,"wc":75,"q":"اذكر الفرق بين الإخفاقات النشطة والإخفاقات الكامنة.","model":"الإخفاقات النشطة: لها نتيجة مباشرة وفورية، ويرتكبها عادة العاملون في الخطوط الأمامية للتشغيل مثل السائقين وعمال غرفة التحكم ومشغلي الآلات، وتكون السبب المباشر للحادث.\nالإخفاقات الكامنة: عوامل أو ظروف داخل المنشأة تزيد احتمال وقوع الإخفاقات النشطة، أي الأسباب غير المباشرة، وتكون في الإجراءات الإدارية أو السياسات أو التصميم: ضعف التدريب، عدم الرصد والمراقبة، سوء تصميم المعدات، نقص الموارد.","keys":[["نشطه","نشط"],["كامنه","كامن"],["مباشر"],["خطوط الاماميه","مشغل","سائق"],["تدريب","تصميم","موارد","سياسات"],["احتمال","ظروف","عوامل"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e110","tp":"u1p5","t":"short","d":3,"ex":1,"wc":75,"q":"كيف يتم إنشاء قواعد البيانات لنظام السلامة، وما أهمية البيانات؟","model":"البيانات أداة أساسية في نظام السلامة، ويجب أن تكون مترابطة وحديثة وعالية الجودة.\nإنشاء قواعدها: أشخاص مؤهلون ومدربون على الجمع، تحديد الهدف العام من الجمع، استخدام التقنية والأجهزة الحديثة، أن تكون منتظمة ودورية، إعطاء صلاحيات الوصول للمسؤولين، وجود هيكل تنظيمي للجمع والحفظ.\nفوائدها: دعم قرارات الإدارة العليا، معرفة احتياجات التدريب، المقارنة المعيارية، التحسين المستمر، زيادة الوعي.\nتحدياتها: الوقت الطويل، التحيز، دقة البيانات.","keys":[["مؤهل","مدرب"],["هدف"],["تقنيه","تكنولوجيا"],["حديثه","منتظمه","دوريه","جوده"],["قرار"],["تحيز","وقت","تحديات"],["مقارنه","تدريب","تحسين"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e111","tp":"u1p3","t":"short","d":3,"ex":1,"wc":75,"q":"ما الفرق بين مؤشرات الأداء الرئيسية وأهداف SMART؟","model":"مؤشرات الأداء الرئيسية: نتائج وقياسات مستخرجة من فحص مكونات النظام وعمليات السلامة، وهي أدوات قياس ورصد تساعد على التنبؤ بالحادث وإدخال تدابير التحكم مبكرًا. تقوم على الإحصاءات وتسهل مقارنتها.\nأهداف SMART: غايات تطمح المنشأة للوصول إليها، ويجب أن تكون محددة، قابلة للقياس، قابلة للإنجاز، ذات صلة، ومحددة بوقت.\nفالمؤشر يقيس أين نحن، والهدف يحدد إلى أين نريد أن نصل، وتُراقَب الأهداف بمتابعة المؤشرات.","keys":[["قياس","رصد"],["غايه","غايات","تطمح","طموح"],["محدد"],["وقت","زمن"],["احصا","نتائج","تنبؤ"]],"e":"","src":"جامع أسئلة الدفعتين 5 و6"},
{"id":"e112","tp":"u1p3","t":"short","d":3,"ex":1,"wc":75,"q":"اذكر أنماط الإدارة ومستوياتها مع الشرح بإيجاز.","model":"الأنماط: الإدارة بالقيادة (تركز على القائد وقدرته على تحفيز تابعيه)، الإدارة بالتحكم (الإشراف الصارم وإنفاذ الأوامر)، الإدارة بالمهام (توجيهات عامة مع حرية التصرف). والنموذج السائد الآن الإدارة حسب الأهداف.\nالمستويات:\nالعليا: تحدد السياسات والأهداف والميزانية وأهم القرارات.\nالمتوسطة: تضع أهداف القسم وتتعاون مع الإدارات الأخرى وتعتمد التدريب.\nالدنيا: تشرف على العمال وتدربهم وترفع التقارير والبلاغات للرؤساء.","keys":[["قياده"],["تحكم"],["مهام"],["عليا"],["متوسطه","وسطي"],["دنيا","اشراف"],["اهداف"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e201","tp":"u2p3","t":"short","d":3,"ex":1,"wc":150,"q":"اشرح هرم الضوابط (هرم التحكم بالمخاطر) بالتفصيل.","model":"هرم الضوابط نظام لتقليل التعرض للمخاطر أو القضاء عليها، ويبدأ من الأعلى (الأكثر فاعلية)، ولا يُنتقل إلى الطابق التالي إلا بعد استنفاد فرص الطابق الحالي:\n1) الإزالة: إزالة مصدر الخطر كليًا، وهي الأكثر فاعلية لكنها ليست متاحة دائمًا. مثال: إزالة المواد الكيميائية غير المستخدمة من خط الإنتاج.\n2) الاستبدال: استبدال الخطر بأقل خطورة. مثال: مادة أقل ضررًا، أو جهد 110 فولت بدل 220.\n3) التحكم الهندسي: عزل الخطر عن الأشخاص. مثال: غرفة عازلة للضوضاء، حواجز على الأجزاء الدوارة، تهوية موضعية.\n4) التحكم الإداري: تغيير طريقة العمل. مثال: إجراءات وتعليمات، تصاريح عمل، تدريب، تناوب العمال، علامات تحذيرية.\n5) معدات الحماية الشخصية: الأقل فاعلية لأنها تقلل أثر الإصابة ولا تمنع وقوعها وتحمي مرتديها فقط.\nويمكن استخدام أكثر من ضابط للخطر نفسه.","keys":[["ازاله"],["استبدال"],["هندسي","هندسيه"],["اداري","اداريه"],["حمايه الشخصيه","وقايه الشخصيه","ppe"],["الاقل","اخر خط","اخر"],["مثال","مثل"],["عزل","حواجز","تهويه"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e202","tp":"u2p1","t":"short","d":3,"ex":1,"wc":75,"q":"ما معنى اختصار ALARP؟ مع الشرح.","model":"ALARP تعني: أدنى مستوى معقول قابل للتطبيق عمليًا (As Low As Reasonably Practicable).\nهو مبدأ لتقليل الخطر إلى أدنى مستوى مقبول مع مراعاة الجهد والوقت والتكلفة، بحيث يتناسب حجم الجهد مع حجم الخطر، دون اشتراط إزالة الخطر تمامًا.\nيُصنف الخطر في ثلاثة مستويات: مقبول على نطاق واسع، مقبول بشروط (يُتحمل مع العمل على تخفيضه)، وغير مقبول يجب إيقاف العمل فيه وتقليل المخاطرة.\nوهو عملية مستمرة تُراجع طوال فترة العمل.","keys":[["ادني مستوي","ادني"],["معقول"],["تطبيق","عملي"],["تكلفه","جهد","وقت"],["غير مقبول"],["مقبول"],["ثلاث","مستويات","مناطق"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e203","tp":"u2p1","t":"short","d":3,"ex":1,"wc":75,"q":"عرّف المخاطرة طبقًا لتعريف ISO 45001 مع أمثلة.","model":"المخاطرة: مزيج من احتمالية وقوع حدث خطر أو تعرض مرتبط بالعمل، وشدة الإصابة أو الاعتلال الصحي الذي قد ينتج عنه. أي: احتمالية حدوث الضرر والعواقب المترتبة عليه.\nأمثلة:\n- العمل على ارتفاع بلا حواجز حماية أو حزام أمان.\n- العمل على تيار كهربائي حي دون فصل الكهرباء.\n- السير على أرضيات زلقة دون حذاء مضاد للانزلاق.\n- السير في مسارات المعدات الثقيلة وعدم الالتزام بمسارات المشاة.","keys":[["احتمال"],["شده","عواقب","نتائج"],["اصابه","ضرر","اعتلال"],["مثال","مثل","ارتفاع","كهرب","زلق"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات) + نص المعيار"},
{"id":"e204","tp":"u2p3","t":"short","d":3,"ex":1,"wc":75,"q":"قارن بين الضوابط الوقائية وضوابط الحماية من حيث الأولوية والاستباقية، مع أمثلة.","model":"تدابير الوقاية: تؤثر على احتمالية وقوع الحادث، فهي استباقية وتُتخذ قبله ولها الأولوية عند الاختيار. مثال: العزل الهندسي للخطر، الإزالة والاستبدال، تعزيز ثقافة الإبلاغ.\nتدابير الحماية: تؤثر على نتائج الحادث وتحد من عواقبه، وتُراعى فيها التدابير الجماعية أولًا ثم الفردية. مثال: تناوب العمال لتقليل مدة التعرض للضوضاء، أنظمة الإطفاء والإنذار، معدات الحماية الشخصية.\nوعند فشل الاثنين تأتي تدابير التخفيف مثل خطط الطوارئ والإخلاء. والنوعان مكملان لبعضهما.","keys":[["وقايه","وقائي"],["حمايه"],["احتمال"],["نتائج","عواقب","شده"],["قبل","استباقي"],["جماعي","فردي"],["مثال","مثل"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e205","tp":"u2p2","t":"short","d":3,"ex":1,"wc":75,"q":"اذكر الأسئلة التسلسلية لعملية تحليل أخطار الوظيفة.","model":"بعد تقسيم الوظيفة إلى خطوات، يُسأل في كل خطوة:\n1) ما المخاطر المحتملة (ما الذي قد يسوء)؟\n2) من الذي قد يتعرض لها؟\n3) ما الأسباب الجذرية المحتملة؟\n4) ما احتمال وقوع حادث نتيجة التعرض؟\n5) ما العواقب المتوقعة؟\n6) هل يكفي الوصف النوعي أم نحتاج بيانات كمية؟\n7) ما الضوابط المناسبة، وهل يمكن إزالة الخطر تمامًا؟\n8) من المسؤول عن تنفيذ الضوابط وما المدة اللازمة؟","keys":[["مخاطر المحتمله","ما الذي","يسوء","ما المخاطر"],["من قد","يتعرض","من الذي"],["اسباب"],["احتمال"],["عواقب","نتائج"],["ضوابط","تحكم","ازاله"],["مسؤول","مسئول","مده"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)"},
{"id":"e206","tp":"u2p4","t":"short","d":3,"ex":1,"wc":75,"q":"اشرح الدور الذي يلعبه النهج القائم على أهداف SMART في تطوير عملية إدارة المخاطر.","model":"أهداف SMART تجعل إدارة المخاطر قابلة للقياس والمتابعة بدل أن تبقى نوايا عامة:\n- محددة: تربط كل خطر بضابط واضح ومسؤول معين.\n- قابلة للقياس: تُتابع بمؤشرات رائدة وناتجة (مثل نسبة إغلاق ملاحظات سجل المخاطر).\n- قابلة للإنجاز وواقعية: تتناسب مع الموارد ومبدأ ALARP.\n- محددة بوقت: موعد لتنفيذ كل ضابط ومراجعته.\nوبذلك تدعم ترتيب الأولويات، والمساءلة، ومراجعة فعالية الضوابط، والتحسين المستمر.\n(لم أجد إجابة نموذجية لهذا السؤال في ملفاتك؛ هذه صياغة مبنية على محتوى الوحدتين الأولى والثانية.)","keys":[["محدد"],["قياس","مؤشر"],["وقت","زمن","موعد"],["مسؤول","مساءله"],["اولويات","ضوابط","سجل"],["تحسين","مراجعه"]],"e":"","src":"صياغة عامة (لا توجد إجابة في الملفات)"},
{"id":"e207","tp":"u2p1","t":"short","d":3,"ex":1,"wc":75,"q":"اشرح الخطوات الأساسية لإدارة المخاطر (كيف يتم تقييم المخاطر).","model":"1) تحديد الأخطار: تحديد مصادر المخاطر والأسباب التي تؤدي إلى حدوثها.\n2) تحديد من قد يتعرض للأذى: من العنصر البشري أو المرافق أو الآلات.\n3) تقييم المخاطر واتخاذ قرارات السيطرة عليها: تصنيفها بحسب نوعها واعتماد التدابير الفعالة.\n4) تقييم ما إذا كانت تدابير الرقابة القائمة كافية وفعالة أم نحتاج تدابير إضافية.\n5) تسجيل النتائج ومراجعتها وتحديثها إذا لزم الأمر.","keys":[["تحديد الاخطار","تحديد المخاطر","تحديد"],["من قد","يتعرض","يتضرر"],["تقييم"],["تدابير","ضوابط","سيطره"],["تسجيل","توثيق"],["مراجعه","تحديث"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e208","tp":"u2p1","t":"short","d":3,"ex":1,"wc":75,"q":"اذكر مبادئ إدارة المخاطر مع شرح موجز.","model":"1) سياق المنشأة: تتأثر كل منشأة بعوامل بيئتها السياسية والقانونية والثقافية.\n2) إشراك الأطراف المعنية في كل خطوة من صنع القرار.\n3) أهداف المنشأة: السلامة وتقييم المخاطر جزء لا يتجزأ من نظام الإدارة.\n4) الإبلاغ: معلومات صحيحة وشفافة.\n5) الأدوار والمسؤوليات: يعرف كل فرد دوره في كل مرحلة.\n6) الهيكل التنظيمي.\n7) مؤشرات الإنذار المبكر: تتبع العلامات المبكرة للخطر.\n8) دورة المراجعة: تقييم دوري مستمر.\n9) الثقافة الداعمة.\nويضيف أحد الملفات: التحسين المستمر.","keys":[["سياق"],["اطراف المعنيه","اشراك"],["اهداف"],["ابلاغ"],["ادوار","مسؤوليات"],["انذار المبكر","انذار"],["مراجعه"],["ثقافه"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e209","tp":"u2p2","t":"short","d":3,"ex":1,"wc":75,"q":"عرّف سجل المخاطر، وكيف يُستفاد منه؟","model":"سجل المخاطر وثيقة مراجعة تسجل ملخصًا شاملًا للمخاطر وأولوياتها والضوابط المطلوبة للتصدي لها أو تخفيف ضررها، وهو جزء أساسي من نظام السلامة.\nفوائده: تحديد المسؤول عن كل خطر ومساءلته، ترتيب الأولويات وتركيز الموارد المحدودة على أهم المخاطر، تحديد من قد يُصاب، تقديم أدلة موثقة تحقق الامتثال، دعم قرارات الإدارة العليا، والإفادة في المقارنة المعيارية.\nويجب تحديثه باستمرار لتطوير تحليل الأخطار.","keys":[["وثيقه","ملخص"],["اولويات"],["ضوابط"],["مسؤول","مساءله"],["امتثال","ادله"],["تحديث","باستمرار"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e210","tp":"u2p2","t":"short","d":3,"ex":1,"wc":75,"q":"ما مصادر المعلومات التي يمكن توظيفها في عملية إدارة المخاطر؟","model":"1) تعليمات الشركات المصنعة للمعدات لتلافي الأخطاء الشائعة، وبيانات سلامة المواد لمعرفة أخطار التعرض لها وكيفية علاج من يتعرض.\n2) سجلات الحوادث والإصابات والأمراض السابقة لأنها توضح كثيرًا من الأخطار.\n3) تقارير عمليات التفتيش ونتائج الملاحظات لمعرفة أماكن المخاطر.\n4) مناقشة العاملين وأصحاب الخبرة، والاستعانة بمكاتب الاستشارات عند الحاجة.","keys":[["مصنعه","مصنع","تعليمات"],["بيانات سلامه","سلامه المواد","المواد"],["سجلات","حوادث","اصابات"],["تفتيش","تقارير"],["عاملين","خبره","استشار"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e211","tp":"u2p3","t":"short","d":3,"ex":1,"wc":75,"q":"كيف يتم التخفيف من حدة المخاطر؟","model":"بعض المخاطر لا يمكن تجنبها أو القضاء عليها، فتُخفف حدتها إلى أدنى مستوى مقبول وفق مبدأ ALARP عبر تدابير التخفيف، وهي تأتي بعد فشل تدابير الوقاية والحماية ووقوع الحادث.\nأمثلتها: خطط الطوارئ، عمليات الإخلاء، نظم الإنذار، أنظمة إطفاء الحرائق، التدريب والتمارين على الاستجابة، خطة العودة إلى العمل.\nهدفها الحد من شدة الضرر الذي يلحق بالموظفين والمرافق، ومن الخسائر المالية وتشويه السمعة.","keys":[["تخفيف"],["alarp","ادني مستوي"],["فشل","بعد"],["طوارئ"],["اخلاء","انذار","اطفاء"],["شده","ضرر","حد"]],"e":"","src":"جامع أسئلة الدفعتين 5 و6"},
{"id":"e212","tp":"u2p4","t":"short","d":3,"ex":1,"wc":75,"q":"كيف يؤثر نظام الجودة والتدريب على فعالية نظام السلامة والصحة المهنية؟","model":"نظام إدارة الجودة مجموعة منسقة من القيم والعمليات تثبت بها المنشأة وفاءها بالمعايير وتوقعات عملائها، ومعياره ISO 9001. يؤثر على السلامة بتحقيق أهدافها باستمرار، وتقليل الأخطاء المكلفة، والوفاء بمتطلبات الامتثال، ودعم التحسين المستمر.\nوالتدريب يحسن قدرة العاملين وأداءهم بإكسابهم المعرفة والكفاءة والمهارات اللازمة لأداء العمل بأمان، فيرفع جودة النظام وفعاليته. لذلك يضمن صاحب العمل تدريبًا مناسبًا وكافيًا لكل دور ووظيفة.","keys":[["جوده"],["9001"],["تحسين المستمر","تحسين"],["تدريب"],["كفاءه","مهارات","معرفه"],["اخطاء","امتثال","اهداف"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e213","tp":"u2p2","t":"short","d":3,"ex":1,"wc":75,"q":"هناك طريقتان لتحليل المخاطر: الاستنتاجية والاستقرائية. اذكر مسماهما الآخر مع الشرح.","model":"الطريقة الاستنتاجية = تحليل المصدر: تحديد مصدر الخطر بدقة وتفصيل ووضع تدابير التخفيف المناسبة، والمصدر قد يكون داخليًا أو خارجيًا. مثال: مراجعة تعليمات الشركة المصنعة وبيانات سلامة المواد. أي نبدأ من مصدر الخطر لمعرفة تأثيره.\nالطريقة الاستقرائية = تحليل المشكلة: تحليل التأثير بدل السبب. مثال: إصابة موظف، فقدان النتائج، التهديد بخسارة مالية. أي نبدأ من المشكلة وتأثيرها لمعرفة مصدر الخطر.","keys":[["استنتاجي"],["استقرائي"],["مصدر"],["مشكله"],["تاثير","اثر"],["مثال","مثل","مصنعه"]],"e":"","src":"جامع أسئلة الدفعتين 5 و6"},
{"id":"e301","tp":"u3p2","t":"short","d":3,"ex":1,"wc":75,"q":"وضّح الفرق بين عملية التفتيش وعملية التدقيق مع أمثلة.","model":"التدقيق: عملية منهجية ومستقلة وموثقة للحصول على الأدلة وتقييمها موضوعيًا. يركز على الإدارة والبرامج والخطط والأهداف، ويقيّم كفاءة العاملين وثقافة السلامة عبر الوثائق والمقابلات، ونتائجه نوعية. مثال: تدقيق نظام التدريب أو الامتثال للآيزو.\nالتفتيش: البحث عن الأخطار والتصرفات غير الآمنة والإجراءات الروتينية وجمع العينات. يركز على المعدات ومكان العمل، ونتائجه كمية. مثال: التفتيش على طفايات الحريق أو أخذ عينات هواء.\nوكلاهما يهدف إلى مكان عمل آمن وأفضل الممارسات.","keys":[["منهجي","منهجيه","مستقل","موثق"],["نوعي"],["كمي"],["معدات","مكان العمل","تصرفات غير"],["اداره","نظام","وثائق","مقابلات"],["مثال","مثل"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e302","tp":"u3p1","t":"short","d":3,"ex":1,"wc":75,"q":"اشرح بإيجاز أنواع التدقيق.","model":"من حيث الجهة:\nداخلي (طرف أول): مدققون تابعون للمنشأة؛ أقل تكلفة وأعرف بالعمل، لكنه قد يتحيز.\nخارجي طرف ثانٍ: شركاء أو عملاء أو موردون لتحقيق منافع مشتركة.\nخارجي طرف ثالث: جهات معتمدة تمنح شهادات المطابقة؛ مستقل لكنه مكلف.\nومن حيث الموضوع (ستة): التدقيق على مواضيع محددة، على نظام إدارة السلامة، للامتثال أو التحقق، التقني لمرافق المنشأة، التقني للموقع، وللمصادقة.","keys":[["داخلي","اول"],["خارجي"],["ثاني","ثان"],["ثالث"],["امتثال"],["مصادقه","شهاده"],["مواضيع","تقني","نظام"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، جامع أسئلة الدفعتين 5 و6"},
{"id":"e303","tp":"u3p3","t":"short","d":3,"ex":1,"wc":150,"q":"كُلِّفت من مجلس الإدارة بإنشاء إطار عمل متماسك للتفتيش على السلامة. ضع خطة منطقية مع أهداف SMART ومؤشرات أداء رئيسية.","model":"الإطار:\n1) النطاق: برنامج يشمل مكان العمل، الأفراد، المعدات، العمليات، مبني على أسئلة من/ماذا/كيف/متى/أين وعلى مستوى المخاطر.\n2) الأدوات: قوائم فحص مرجعية لكل منطقة (البيئة، المباني، الكهرباء، معدات الحريق، المواد الخطرة، معدات الحماية).\n3) الجدول والأشخاص: برنامج زمني، تحديد المفتشين وكفاءاتهم وتدريبهم، وأدوار منفذي الإجراءات التصحيحية.\n4) التنفيذ والتقرير: تقرير نهائي بالملاحظات والإجراء التصحيحي والمسؤول والمدة، ثم متابعة الإغلاق والمراجعة.\nأهداف SMART (أمثلة): تفتيش 100% من معدات الرفع شهريًا؛ إغلاق 90% من الملاحظات خلال 14 يومًا؛ تدريب كل المفتشين خلال الربع الأول.\nمؤشرات الأداء: نسبة الجولات المنفذة إلى المخططة، نسبة إغلاق الملاحظات في وقتها، عدد الملاحظات المتكررة، عدد المقابلات مع العاملين.","keys":[["مكان العمل","افراد","معدات","عمليات"],["قوائم","قائمه"],["جدول","زمني","برنامج"],["مفتش","كفاءات","ادوار"],["تصحيحي","اغلاق"],["نسبه","100","90"],["مؤشر"],["تقرير"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)"},
{"id":"e304","tp":"u3p1","t":"short","d":3,"ex":1,"wc":75,"q":"وضّح الجوانب التي يفحصها التدقيق الخارجي (طرف ثانٍ) في نظام السلامة.","model":"تدقيق الطرف الثاني تجريه جهة خارجية مرتبطة بالمنشأة: شريك أو عميل أو مورد، أو منشأة في المجال نفسه، باتفاق الطرفين ولتحقيق منافع مشتركة.\nيفحص: امتثال المنشأة لمتطلبات المدقق والعقد، الامتثال للقوانين والمواصفات الدولية، تطبيق إجراءات السلامة فعليًا، إدارة المخاطر والضوابط، كفاءة العاملين وسجلات الحوادث والتدريب.\nويعود على المنشأة بالنفع تعاقديًا وماليًا وفي السمعة، ويدعم التحسين المستمر.","keys":[["طرف ثان","ثاني"],["عميل","مورد","شريك","عملاء","موردين"],["متطلبات","عقد","اتفاق"],["امتثال","قوانين"],["سمعه","منافع","تحسين"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، جامع أسئلة الدفعتين 5 و6"},
{"id":"e305","tp":"u3p1","t":"short","d":3,"ex":1,"wc":75,"q":"عرّف التدقيق واذكر بعض المهارات الأساسية التي ينبغي أن يتمتع بها المدقق.","model":"التدقيق: عملية منهجية ومستقلة وموثقة للحصول على أدلة التدقيق وتقييمها بشكل موضوعي لتحديد مدى استيفاء معايير التدقيق.\nمهارات المدقق:\n- معرفة مبادئ السلامة والصحة المهنية والقوانين والمتطلبات.\n- العلم بعمليات المنشأة وأنشطتها والمتطلبات داخل مكان العمل.\n- معرفة طرق السيطرة على المخاطر وتدقيق البيانات كسجلات الحوادث.\n- العلم بمبادئ التدقيق وأدواته.\nولكفاءة المدقق أثر مباشر في جودة التدقيق وفاعلية النظام.","keys":[["منهجيه","منهجي"],["مستقله","مستقل"],["موثقه","موثق"],["ادله","موضوعي"],["مبادئ السلامه","قوانين"],["عمليات","انشطه"],["مخاطر","ادوات","مبادئ التدقيق"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e306","tp":"u3p3","t":"short","d":3,"ex":1,"wc":75,"q":"وضّح كيف تدعم القوائم المرجعية عمليات التدقيق والتفتيش.","model":"القائمة المرجعية عنصر أساسي لنجاح التفتيش والتدقيق لأنها:\n- توضح نطاق التفتيش والنقاط التي سيُفتش عليها.\n- تدعم تقارير التفتيش وتسهل ترتيبها.\n- تساعد على التحكم في أنشطة التفتيش.\n- توفر الوثائق والأدلة.\n- توحد المعايير فتقل الاختلافات بين المفتشين.\n- تقلل الأخطاء ونسيان البنود.\nوتُقسم إلى مجالات مثل: البيئة، المباني، المعدات الكهربائية، معدات الحريق، معدات الحماية الشخصية.","keys":[["نطاق","وضوح"],["تقارير","تقرير"],["تحكم"],["وثائق","ادله","توثيق"],["توحيد","معايير"],["اخطاء","نسيان"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، جامع أسئلة الدفعتين 5 و6"},
{"id":"e307","tp":"u3p1","t":"short","d":3,"ex":1,"wc":75,"q":"اذكر الخطوات الأساسية لعملية التدقيق مع الشرح بإيجاز.","model":"1) التحضير: تجهيز الوثائق والسجلات والاستبيانات والقوائم المرجعية.\n2) دراسة الوثائق: بشكل مفصل لتحديد المعلومات المهمة التي تدعم التدقيق.\n3) بدء التدقيق: جمع المعلومات بالزيارات الميدانية والمقابلات والملاحظات، ثم تحليلها وتأكيد صحتها مع المعنيين.\n4) تحرير التقرير النهائي الشامل.\n5) التواصل مع المعنيين للمصادقة على التقرير واعتماده.\n6) إرساله للإدارة للأخذ بالتوصيات واتخاذ الإجراءات التصحيحية.","keys":[["تحضير"],["دراسه الوثائق","وثائق"],["مقابلات","زيارات","جمع"],["تحليل"],["تقرير"],["تصحيحي","توصيات","مصادقه"]],"e":"","src":"جامع أسئلة الدفعتين 5 و6"},
{"id":"e308","tp":"u3p1","t":"short","d":3,"ex":1,"wc":75,"q":"اذكر المعوقات التي تتسبب في فشل عملية التدقيق.","model":"- عدم استقلال المدقق أو نقص مهاراته، مما يؤدي إلى نتائج مربكة أو مضللة.\n- اللبس بين معايير التدقيق.\n- تركيز المدققين على الوثائق فقط وعدم السماح بمشاركة العاملين والاستماع إليهم.\n- التركيز على الوثائق بدل ملاحظة الواقع.\n- الانحياز إذا كان التدقيق داخليًا.\n- نقص البيانات مثل بيانات الإبلاغ.\n- أن يصبح هدف المنشأة تجاوز مرحلة التدقيق لا جعل المكان آمنًا.","keys":[["استقلال"],["مهارات","نقص"],["وثائق"],["مشاركه","عاملين","عمال"],["تحيز","انحياز"],["بيانات","واقع"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e309","tp":"u3p1","t":"short","d":3,"ex":1,"wc":75,"q":"ما المقصود بشهادة المصادقة، وما سلبياتها؟","model":"شهادة المصادقة: ثقة مبررة تحصل عليها المنشأة من جهة حكومية أو منظمة دولية معتمدة لتطبيقها القوانين واستيفائها المتطلبات. تحرص عليها المنشآت للمصالح التجارية والسمعة وتطبيق أفضل الممارسات.\nسلبياتها: التحيز وعدم إظهار البيانات الحقيقية، التغاضي عن المشاكل الكبيرة حفاظًا على السمعة والاكتفاء بالبسيطة، مما يولد شعورًا زائفًا بالأمان قد ينتهي بحوادث خطيرة بعد فترة وجيزة من صدور الشهادة، وإهمال جوانب مهمة كالقضايا النفسية والاجتماعية للعاملين.","keys":[["شهاده","مصادقه"],["معتمده","جهه"],["تحيز"],["سمعه"],["زائف","شعور"],["مشاكل","اخفاء","تغاضي","حقيقيه"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e310","tp":"u3p2","t":"short","d":3,"ex":1,"wc":75,"q":"كيف يتم جمع البيانات في عملية التدقيق؟","model":"يشمل التخطيط تحديد البيانات التي ستُجمع وتُقيَّم، وتختلف بحسب طبيعة عمل المنشأة. الطرق:\n- المقابلات مع الأطراف المسؤولة عن السلامة.\n- التدقيق في الوثائق والسجلات.\n- الملاحظة المباشرة للتدابير الوقائية وأنشطة العمل.\n- اختبار جاهزية الطوارئ لدى العاملين.\n- جرد المعدات والمواد الخطرة.\n- تحضير قوائم المراجعة.\n- الاعتماد على الملاحظة والنظر بدل الذاكرة.","keys":[["مقابلات"],["وثائق","سجلات"],["ملاحظه"],["طوارئ","جاهزيه"],["جرد","قوائم"],["ذاكره"]],"e":"","src":"تجميعة الأسئلة المتكررة"},
{"id":"e401","tp":"u4p3","t":"short","d":3,"ex":1,"wc":150,"q":"اشرح كيف يجب القيام بتدريبات وعمليات المحاكاة لخطط الطوارئ، ولماذا.","model":"لماذا:\n- تحويل الخطط النظرية إلى مهارات عملية وفهم الأدوار والمسؤوليات.\n- تحسين وقت الاستجابة وتقليل التردد والارتباك.\n- كشف الثغرات ونقاط الضعف: قنوات الاتصال، معدات الإنقاذ، وسائل الإنذار.\n- تعزيز التنسيق مع الجهات الخارجية مثل الدفاع المدني والمستشفيات.\n- الامتثال للوائح والمعايير.\n- تقليل الذعر والحفاظ على الهدوء.\nكيف:\n1) تحديد الأهداف وتقييم المخاطر (حريق، إصابة جسيمة، كارثة طبيعية).\n2) تصميم سيناريوهات واقعية ومتنوعة متدرجة الصعوبة.\n3) تحديد الأدوار والمسؤوليات بوضوح.\n4) استخدام تقنيات المحاكاة والتدريب النظري والعملي.\n5) التقييم بعد كل تمرين وتحديث التدريب مع تحديث الخطة.\nوتُنفَّذ دوريًا وبشكل ممنهج.","keys":[["مهارات","عمليه"],["وقت الاستجابه","سرعه","زمن"],["ثغرات","ضعف"],["تنسيق","جهات"],["سيناريو"],["ادوار"],["دوري","مستمر","تحديث"],["اهداف","تقييم المخاطر"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)"},
{"id":"e402","tp":"u4p1","t":"short","d":3,"ex":1,"wc":75,"q":"اشرح بإيجاز مرحلة تحليل البيئة التشغيلية للمنشأة عند وضع خطة الاستجابة للحوادث.","model":"هي أول خطوة في خطة الاستجابة، وتهدف إلى فهم شامل لمجال عمل المنشأة وطبيعته وضوابطها التشغيلية وبيئتها الثقافية والاجتماعية، لتغطي الخطة كل المخاطر المحتملة اعتمادًا على تقييم المخاطر.\nتتضمن: تحديد الأصول والأنظمة الحيوية وأولوياتها، تقييم المخاطر ونقاط الضعف والتهديدات، توثيق الإجراءات وتحديد المسؤوليات، تجهيز المعدات والتقنيات اللازمة، ثم التدريب واختبار الخطة.","keys":[["طبيعه","مجال","نشاط"],["ضوابط","تشغيل"],["ثقاف","اجتماع"],["تقييم المخاطر","مخاطر"],["اصول","موارد","معدات"],["مسؤوليات","ادوار"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e403","tp":"u4p4","t":"short","d":3,"ex":1,"wc":75,"q":"وضّح بإيجاز فيمَ تتمثل دوافع التحقيق في حوادث العمل.","model":"- منع تكرار الحوادث: وهو الدافع الأهم، بتحديد الأسباب الجذرية ووضع إجراءات تصحيحية.\n- حماية الموظفين وضمان بيئة عمل آمنة.\n- الامتثال للمتطلبات القانونية التي تلزم بالتحقيق والتوثيق.\n- تحديد التكاليف المرتبطة بالحادث وتعويضات العمال وتقليل الخسائر.\n- تحسين الروح المعنوية والثقة.\n- التعلم المستمر وتحديث تقييم المخاطر، ودعم المقارنة المعيارية والتحسين المستمر.","keys":[["تكرار","منع"],["جذري","اسباب"],["قانون","امتثال"],["تكاليف","تعويض","خسائر"],["تعلم","دروس","تحسين"],["حمايه","امنه"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، تجميعة الأسئلة المتكررة"},
{"id":"e404","tp":"u4p4","t":"short","d":3,"ex":1,"wc":75,"q":"اشرح بإيجاز المستويات التي يعمل عليها نموذج ACCI-MAP للتحقيق في الحوادث.","model":"نموذج AcciMap يحلل أسباب الحادث عبر مستويات النظام كله لا عند العامل فقط، من الأعلى إلى الأدنى:\n1) الحكومة: السياسات والتشريعات.\n2) الجهات التنظيمية والرقابية.\n3) الشركة: سياساتها وميزانيتها.\n4) الإدارة: التخطيط والإشراف.\n5) الطاقم/الموظفون: أفعالهم وقراراتهم.\n6) العمل: المعدات والبيئة والنشاط نفسه.\nويُربط بين القرارات في المستويات العليا والظروف التي سمحت بالحادث في المستويات الدنيا.\n(ملفاتك لا تتضمن إجابة مفصلة لهذا السؤال؛ راجع صياغة الكتيب.)","keys":[["حكومه"],["تنظيمي","رقابي","جهات"],["شركه"],["اداره"],["موظف","طاقم","عامل"],["العمل","معدات","بيئه"]],"e":"","src":"حلول أسئلة فبراير + صياغة عامة"},
{"id":"e405","tp":"u4p1","t":"short","d":3,"ex":1,"wc":75,"q":"وضّح الفرق بين الحوادث والحوادث الوشيكة (والأحداث) مع التمثيل.","model":"الحدث: واقعة ناشئة عن العمل أو أثناءه لها القدرة على التسبب بإصابة أو اعتلال صحي، أو تسببت به.\nالحادث: حدث نتج عنه فعلًا إصابة أو اعتلال صحي أو ضرر. مثال: سقوط عامل من سقالة وكسر ساقه.\nالحادث الوشيك: حدث لم ينتج عنه أذى لكن كانت له القدرة على ذلك. مثال: سقوط مطرقة من ارتفاع بجانب عامل دون أن تصيبه.\nكلها غير مخطط لها وغير مرغوب فيها. كل حادث حدث وليس كل حدث حادثًا. والوشيك فرصة مجانية لتصحيح المسار قبل الإصابة.","keys":[["اصابه","ضرر","اعتلال"],["وشيك","شبه"],["قدره","كان يمكن","لم ينتج","لم يسفر","دون"],["مثال","مثل","سقوط"],["غير مخطط","فرصه","حدث"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، جامع أسئلة الدفعتين 5 و6"},
{"id":"e406","tp":"u4p2","t":"short","d":3,"ex":1,"wc":75,"q":"اشرح بعض الحالات التي تشملها لوائح الإبلاغ عن الإصابات والأمراض والحوادث الخطرة، والمعلومات الواجب توفرها في نموذج الإبلاغ المثالي.","model":"الحالات:\n- الوفيات المرتبطة بالعمل.\n- الإصابات المحددة: الكسور (عدا الأصابع)، البتر، فقدان البصر، الحروق التي تغطي أكثر من 10% من الجسم.\n- الأمراض المهنية: متلازمة النفق الرسغي، الربو المهني، الالتهابات الجلدية.\n- الأحداث الخطيرة: سقوط معدات الرفع، انفجار أو حريق يوقف العمل أكثر من 24 ساعة.\n- إصابة غير العاملين إذا نُقلوا للمستشفى.\nفي السعودية يُبلَّغ للتأمينات الاجتماعية.\nالنموذج: اسم المصاب ومهنته وقسمه، مكان ووقت الحادث، تفاصيله ونوع الإصابة، الشهود، الإجراء الفوري، اسم المبلّغ؛ لأنها أساس التحقيق ومنع التكرار.","keys":[["وفا","وفيات","وفي"],["كسور","بتر","حروق","بصر"],["امراض المهنيه","مرض","ربو","نفق"],["خطيره","انفجار","حريق","رفع"],["اسم"],["وقت","مكان","تاريخ"],["تفاصيل","شهود","وصف"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، جامع أسئلة الدفعتين 5 و6"},
{"id":"e407","tp":"u4p1","t":"short","d":3,"ex":1,"wc":75,"q":"ضع خطة فعالة للاستجابة للحوادث (خطوات خطة الاستجابة).","model":"1) تحليل بيئة التشغيل للمنشأة.\n2) تحديد السيناريوهات المحتملة لحالات الطوارئ اعتمادًا على تقييم المخاطر.\n3) بناء فريق قوي يعرف كل فرد فيه دوره: قائد الحادث، مسؤولو الإخلاء، الإنقاذ، الأمن.\n4) قياس المخاطر بمصفوفة المخاطر لمعرفة الأشد والأكثر احتمالًا.\n5) إنشاء إرشادات استجابة سريعة: رسومات وعلامات للمخارج والطفايات.\n6) تدريب جميع العاملين.\n7) خطة العودة للحالة الطبيعية.\n8) إشراك الإدارات والمنشآت ذات الصلة.\n9) استخلاص المعلومات والدروس من الحوادث.","keys":[["بيئه التشغيل","تحليل"],["سيناريو"],["فريق","قائد"],["مصفوفه","قياس"],["ارشادات","علامات"],["تدريب"],["عوده","طبيعيه"],["دروس","استخلاص","اشراك"]],"e":"","src":"تجميعة الأسئلة المتكررة"},
{"id":"e408","tp":"u4p4","t":"short","d":3,"ex":1,"wc":75,"q":"عرّف الأسباب المباشرة وغير المباشرة للحوادث مع مثالين لكل منهما.","model":"الأسباب المباشرة: نتيجة الاتصال الجسدي بشيء أو مادة خطرة، وتكون عادة نتيجة فعل غير آمن أو ظرف غير آمن أو كليهما. أمثلة: عدم استخدام معدات الحماية الفردية، العمل بلا تصريح، ترك المعدات في ظروف خطيرة، استخدام المعدات بصورة خاطئة.\nالأسباب غير المباشرة: تعود إلى سياسات وقرارات الإدارة أو عوامل شخصية وبيئية، وهي الأسباب الأساسية. أمثلة: ضعف السياسات والإجراءات، ضعف التدريب والإشراف، نقص الموارد.\nمثال: انزلاق عامل (المباشر: زيت على الأرضية؛ غير المباشر: عدم صيانة التسرب).","keys":[["مباشر"],["غير مباشر","غير المباشر","اساسيه"],["فعل غير","تصرف غير","ظرف غير","غير امن"],["حمايه","تصريح","معدات"],["تدريب","سياسات","موارد","اشراف"]],"e":"","src":"تجميعة الأسئلة المتكررة، جامع أسئلة الدفعتين 5 و6"},
{"id":"e409","tp":"u4p4","t":"short","d":3,"ex":1,"wc":75,"q":"ما المقصود بالانتهاكات، وما أنواعها؟","model":"الانتهاك: انحراف مقصود عن القواعد والإجراءات واللوائح والتعليمات الضرورية للحفاظ على السلامة.\nأنواعه:\n- روتينية: تجاوزات أصبحت سائدة في العمل ويعتقد العاملون أنها طبيعية.\n- موضعية: تجاوزات بسبب ظروف العمل مثل نقص الموظفين أو ضيق الوقت.\n- استثنائية: نادرة الحدوث، تقع عند نقص المعرفة ومحاولة حل مشكلة للوصول إلى هدف معين.","keys":[["مقصود","متعمد","انحراف"],["روتيني"],["موضعي","ظرف"],["استثنائي","نادر"],["قواعد","اجراءات"]],"e":"","src":"تجميعة الأسئلة المتكررة"},

{"id":"e501","tp":"u5p1","t":"short","d":3,"ex":1,"wc":150,"q":"عرّف ثقافة الإبلاغ ثم اشرح كيف تدعم السلامة والصحة المهنية في المنشأة مع التمثيل.","model":"ثقافة الإبلاغ: نظام سلوكي وتنظيمي يشجع العاملين على الإبلاغ عن المخاطر والممارسات غير الآمنة والحوادث والحوادث الوشيكة دون خوف من اللوم أو العقاب، ويقوم على الشفافية والثقة والتواصل المفتوح بين الإدارة والعاملين. وهي من عناصر الثقافة الإيجابية مع ثقافة التعلم وثقافة العدل.\nكيف تدعم السلامة:\n1) كشف المخاطر مبكرًا قبل أن تصبح حوادث. مثال: عامل يبلّغ عن سلك مكشوف فيُصلَح فورًا.\n2) تحليل الاتجاهات ومعرفة المواقع الأخطر. مثال: تكرار بلاغات الانزلاق في منطقة يدفع لتحسين الأرضية.\n3) تعزيز الثقة بين العاملين والإدارة. مثال: نظام إبلاغ يحمي المبلّغ.\n4) رفع الوعي بالمخاطر والتعلم من البلاغات.\n5) دعم القرارات المبنية على البيانات: توجيه التدريب والصيانة.","keys":[["دون خوف","لوم","عقاب"],["وشيك","شبه","مخاطر"],["ثقه","شفافيه"],["مبكر","قبل"],["مثال","مثل"],["بيانات","تحليل","اتجاهات"],["تعلم","وعي"]],"e":"","src":"الاختبار التجريبي (ملف الإجابات)، جامع أسئلة الدفعتين 5 و6"},

const norm=s=>String(s).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^؀-ۿa-z0-9\s]/g,'').trim().replace(/\s+/g,' ');

}

}

/* ---------- MAP ---------- */
function vMap(){
  return `<div class="maptools"><button class="btn sm" data-a="expand">توسيع الكل</button><button class="btn sm" data-a="collapse">طي الكل</button><span class="muted">اضغط على الوحدة لفتح موضوعاتها، وعلى الموضوع لعرض تفاصيله.</span></div>
  <div class="mapwrap" id="mapwrap"><div class="canvas" id="canvas"></div></div>
  <div class="legend"><span><i style="background:var(--good)"></i>متقن (≥80%)</span><span><i style="background:var(--warn)"></i>متوسط</span><span><i style="background:var(--bad)"></i>ضعيف</span><span><i style="background:var(--line)"></i>غير مقاس</span><span>✓ = أنهيت شرح الموضوع</span></div>`;
}
function initMap(){
  const ROW=56,gap=64,cw=[200,250,320],W=cw[0]+cw[1]+cw[2]+gap*2+40;
  const xr=W-cw[0]-20,xu=xr-gap-cw[1],xt=xu-gap-cw[2];
  let y=20;const nodes=[],links=[];const unitY=[];
  UNITS.forEach(u=>{
    const ts=TOPICS.filter(t=>t.u===u.id);let uy;
    if(openUnits[u.id]){const ys=ts.map(t=>{const ty=y;y+=ROW;return ty});
      ts.forEach((t,i)=>nodes.push({k:'t',t,x:xt,y:ys[i],w:cw[2],u}));
      uy=(ys[0]+ys[ys.length-1])/2}
    else{uy=y;y+=ROW}
    unitY.push(uy);nodes.push({k:'u',u,x:xu,y:uy,w:cw[1],open:!!openUnits[u.id]});
  });
  const ry=(unitY[0]+unitY[unitY.length-1])/2;
  const H=y+10,NH=44;
  nodes.push({k:'r',x:xr,y:ry,w:cw[0]});
  nodes.filter(n=>n.k==='u').forEach(n=>links.push([xr,ry,n.x+n.w,n.y]));
  nodes.filter(n=>n.k==='t').forEach(n=>{const p=nodes.find(m=>m.k==='u'&&m.u.id===n.u.id);links.push([p.x,p.y,n.x+n.w,n.y])});
  const c=$('#canvas');c.style.width=W+'px';c.style.height=H+'px';
  const mid=NH/2;
  let svg=`<svg width="${W}" height="${H}">`;
  links.forEach(([x1,y1,x2,y2])=>{const mx=(x1+x2)/2;svg+=`<path d="M${x1},${y1+mid} C${mx},${y1+mid} ${mx},${y2+mid} ${x2},${y2+mid}"/>`});
  svg+='</svg>';
  let h=svg;
  nodes.forEach(n=>{
    const st=`left:${n.x}px;top:${n.y}px;width:${n.w}px;min-height:${NH}px`;
    if(n.k==='r')h+=`<div class="node root" style="${st}">محترف السلامة والصحة المهنية</div>`;
    else if(n.k==='u'){const us=unitStat(n.u.id);h+=`<button class="node unit" data-a="toggle" data-id="${n.u.id}" style="${st};border-color:${n.u.color}" aria-expanded="${n.open}"><span class="dot ${lvl(us.pct)}"></span><span class="t">الوحدة ${n.u.n}: ${esc(n.u.title)}</span><span class="tg">${n.open?'▾':'◂'}</span></button>`}
    else{const s=topicStat(n.t.id);h+=`<button class="node" data-a="topic" data-id="${n.t.id}" style="${st}"><span class="dot ${lvl(s.pct)}"></span><span class="t">${esc(n.t.title)}</span>${S.studied[n.t.id]?'<span class="tk">✓</span>':''}</button>`}
  });
  c.innerHTML=h;
  const w=$('#mapwrap');w.scrollLeft=w.scrollWidth;
}

/* ---------- LEARN ---------- */
const STEPS=['الفكرة الأساسية','الشرح المبسط','التفاصيل المهمة','مثال تطبيقي','المصطلحات','الخلاصة','اختبار الفهم'];
function vLearn(){
  const t=TMAP[selTopic];
  let side='<div class="side">';
  UNITS.forEach(u=>{side+=`<h3 style="color:${u.color}">الوحدة ${u.n}: ${esc(u.title)}</h3>`;TOPICS.filter(x=>x.u===u.id).forEach(x=>{side+=`<button class="titem" data-a="seltopic" data-id="${x.id}" aria-current="${x.id===selTopic}"><span class="dot ${lvl(topicStat(x.id).pct)}"></span><span style="flex:1">${esc(x.title)}</span>${S.studied[x.id]?'<b style="color:var(--good)">✓</b>':''}</button>`})});
  side+='</div>';
  return `<div class="layout"><div>${side}</div><div class="card lesson">${lessonStep(t)}</div></div>`;
}
function lessonStep(t){
  const stepsH=`<div class="steps">${STEPS.map((s,i)=>`<button data-a="step" data-i="${i}" aria-current="${i===step}">${i+1}. ${s}</button>`).join('')}</div>`;
  let body='';
  if(step===0)body=`<h3>لماذا هذا الموضوع مهم؟</h3><p>${esc(t.core)}</p>`;
  if(step===1)body=`<p>${esc(t.explain)}</p>`;
  if(step===2)body=`<ul>${t.details.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>${t.ext.length?`<p><span class="badge b-ext">خارج الملفات أو تعارض بينها</span></p><ul>${t.ext.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}<h3>أخطاء شائعة</h3><ul>${t.mistakes.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`;
  if(step===3)body=`<div class="callout">${esc(t.example)}</div>`;
  if(step===4)body=`<div class="tbl"><table class="terms">${t.terms.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])} — <span class="muted">${esc(r[2])}</span></td></tr>`).join('')}</table></div>`;
  if(step===5)body=`<div class="callout">${esc(t.recap)}</div><p class="note">المصدر: ${esc(t.src)}</p>`;
  if(step===6)body=checkView(t);
  const nav=`<div class="row" style="margin-top:16px">${step>0?'<button class="btn" data-a="prev">→ السابق</button>':''}${step<6?'<button class="btn primary" data-a="next">التالي ←</button>':''}</div>`;
  return `<div class="row"><span class="chip" style="border-color:${UMAP[t.u].color}">الوحدة ${UMAP[t.u].n}</span>${t.cov==='part'?'<span class="badge b-part">من الملخصات وتجميعات الأسئلة</span>':''}</div><h2>${esc(t.title)}</h2><div class="muted" style="direction:ltr;text-align:right">${esc(t.en)}</div>${stepsH}${body}${nav}`;
}
function checkView(t){
  const c=t.chk,st=chkState[t.id]||(chkState[t.id]={perm:shuffle(c.o.map((_,i)=>i)),wrong:0,done:S.studied[t.id]?'ok':null,pick:null});
  let h=`<h3>سؤال للتأكد من الفهم</h3><div class="qtext">${esc(c.q)}</div><div class="opts">`;
  st.perm.forEach(i=>{let cls='';if(st.pick===i)cls=i===c.a?'ok':'no';h+=`<button class="opt ${cls}" data-a="chk" data-i="${i}" ${st.done==='ok'?'disabled':''}>${esc(c.o[i])}</button>`});
  h+='</div>';
  if(st.done==='ok'){
    const idx=TOPICS.findIndex(x=>x.id===t.id),nx=TOPICS[idx+1];
    h+=`<div class="fb ok"><b class="h">إجابة صحيحة ✓</b>${esc(c.e)}<br><span class="note">تم تسجيل الموضوع كمدروس. الإتقان الفعلي يُقاس من نتائج الاختبارات.</span></div><div class="row" style="margin-top:12px">${nx?`<button class="btn primary" data-a="nexttopic" data-id="${nx.id}">الموضوع التالي ←</button>`:''}<button class="btn" data-a="quiztopic" data-id="${t.id}">اختبر هذا الموضوع</button></div>`;
  }else if(st.pick!=null){
    h+=`<div class="fb no"><b class="h">إجابة غير صحيحة — لن ننتقل قبل أن نفهم السبب</b>${esc(c.e)}<br><br><b>شرح بطريقة أخرى:</b> ${esc(c.re)}</div><div class="row" style="margin-top:12px"><button class="btn" data-a="retry">أعد المحاولة</button><button class="btn" data-a="step" data-i="1">أعد قراءة الشرح</button></div>`;
  }
  return h;
}

/* ---------- QUIZ ---------- */
const OBJ=QUESTIONS.filter(q=>!q.ex),ESS=QUESTIONS.filter(q=>q.ex);
const words=v=>String(v).trim().split(/\s+/).filter(Boolean).length;
function poolFor(scope){
  if(scope==='essay'||scope==='essaysim')return ESS;
  if(scope.indexOf('essay:')===0)return ESS.filter(q=>TMAP[q.tp].u===scope.slice(6));
  if(UMAP[scope])return OBJ.filter(q=>TMAP[q.tp].u===scope);
  if(TMAP[scope])return OBJ.filter(q=>q.tp===scope);
  return OBJ;
}
function weakTopics(){
  return TOPICS.map(t=>({t,s:topicStat(t.id)})).filter(x=>x.s.n>0&&x.s.ok<x.s.n).sort((a,b)=>(a.s.ok/a.s.n)-(b.s.ok/b.s.n)||(b.s.n-b.s.ok)-(a.s.n-a.s.ok));
}
function wrongQs(){return QUESTIONS.filter(q=>{const l=latest(q.id);return l&&!l.ok})}
function startQuiz(scope,label,opts){
  opts=opts||{};let pool;
  if(scope==='weak'){const ids=new Set(weakTopics().map(x=>x.t.id));pool=OBJ.filter(q=>ids.has(q.tp))}
  else if(scope==='retest')pool=wrongQs();
  else pool=poolFor(scope);
  if(!pool.length){Q={empty:true,label};render();return}
  const pr=q=>{const l=latest(q.id);return !l?1:l.ok?2:0};
  const sorted=shuffle(pool).sort((a,b)=>pr(a)-pr(b));
  const n=Math.min(opts.n||10,sorted.length);
  let pick=scope==='essaysim'?UNITS.flatMap(u=>sorted.filter(q=>TMAP[q.tp].u===u.id).slice(0,2)):sorted.slice(0,n);
  // تنويع الصعوبة: إن كانت كلها بمستوى واحد وتوجد مستويات أخرى بالمجموعة نبدّل واحدًا
  const ds=new Set(pick.map(q=>q.d));
  if(ds.size<2&&sorted.length>n){const alt=sorted.slice(n).find(q=>!ds.has(q.d));if(alt)pick[pick.length-1]=alt}
  Q={scope,label,list:shuffle(pick).map(q=>q.id),i:0,res:[],cur:null,done:false};
  prep();tab='quiz';render();window.scrollTo({top:0});
}
function prep(){
  const q=QMAP[Q.list[Q.i]],l=latest(q.id);
  const re=l&&!l.ok&&!!q.q2;
  const cur={q,text:re?q.q2:q.q,re,answered:false};
  if(q.o)cur.perm=shuffle(q.o.map((_,i)=>i));
  if(q.t==='order')cur.ord=shuffle(q.items).slice();
  if(q.t==='order'&&cur.ord.join()===q.items.join())cur.ord.reverse();
  Q.cur=cur;
}
function vQuiz(){
  if(Q&&Q.empty)return `<div class="card"><h2>لا توجد أسئلة لهذا النطاق بعد</h2><p>${Q.label==='إعادة اختبار الأخطاء'?'لا أخطاء مسجلة حاليًا — ممتاز! أجب عن اختبار أولًا.':'أجب عن اختبار أولًا لتظهر نقاط الضعف.'}</p><button class="btn primary" data-a="qmenu">القائمة</button></div>`;
  if(!Q)return quizMenu();
  if(Q.done)return quizResult();
  return quizQ();
}
function quizMenu(){
  const sc=s=>poolFor(s).length;
  let h=`<div class="card examcard"><h2>محاكاة الاختبار المقالي</h2><p class="muted">ملفات الاختبارات السابقة في مجلدك كلها أسئلة مقالية بإجابة مكتوبة (75 أو 150 كلمة). هذا القسم يدربك على الصيغة نفسها: ${ESS.length} سؤالًا مأخوذة من الاختبار التجريبي وتجميعات الأسئلة المتكررة، مع نقاط الإجابة النموذجية. الإجابات اجتهاد زملاء وليست رسمية.</p>
  <div class="row"><button class="btn primary" data-a="qstart" data-s="essaysim" data-l="محاكاة الاختبار المقالي">محاكاة: سؤالان من كل وحدة (10 أسئلة)</button>${UNITS.map(u=>`<button class="btn sm" data-a="qstart" data-s="essay:${u.id}" data-l="مقالي الوحدة ${u.n}" data-n="60">مقالي الوحدة ${u.n} (${sc('essay:'+u.id)})</button>`).join('')}</div></div>
  <div class="card" style="margin-top:14px"><h2>اختبارات موضوعية سريعة</h2><p class="muted">لتثبيت المعلومة قبل الكتابة: ${OBJ.length} سؤالًا (اختيار، صح/خطأ، إكمال، ترتيب، سيناريو). سؤال واحد في كل مرة والتصحيح فوري مع الشرح.</p>
  <div class="row"><button class="btn primary" data-a="qstart" data-s="all" data-l="الاختبار الشامل">الاختبار الشامل (10 أسئلة من كل المنهج)</button><button class="btn" data-a="qstart" data-s="all" data-l="الاختبار الشامل الطويل" data-n="30">شامل طويل (30 سؤالًا)</button></div></div>
  <div class="grid g2" style="margin-top:14px">`;
  UNITS.forEach(u=>{h+=`<div class="card"><h3 style="color:${u.color}">الوحدة ${u.n}: ${esc(u.title)}</h3><p class="muted">${sc(u.id)} سؤالًا</p><button class="btn" data-a="qstart" data-s="${u.id}" data-l="اختبار الوحدة ${u.n}">ابدأ اختبار الوحدة</button></div>`});
  h+=`</div><div class="card" style="margin-top:14px"><h3>اختبار موضوع محدد</h3><div class="row"><select id="topicSel" style="max-width:520px">${TOPICS.map(t=>`<option value="${t.id}">${esc('و'+UMAP[t.u].n+' — '+t.title)} (${sc(t.id)})</option>`).join('')}</select><button class="btn" data-a="qtopicsel">ابدأ</button></div></div>
  <div class="card" style="margin-top:14px"><h3>نقاط الضعف</h3><div class="row"><button class="btn" data-a="qstart" data-s="weak" data-l="اختبار نقاط الضعف">اختبار يستهدف نقاط ضعفي</button><button class="btn" data-a="qstart" data-s="retest" data-l="إعادة اختبار الأخطاء">إعادة اختبار أخطائي بصياغة مختلفة</button></div></div>`;
  return h;
}
function quizQ(){
  const c=Q.cur,q=c.q,total=Q.list.length;
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(Q.label)}</b><span class="muted">السؤال ${Q.i+1} من ${total}</span></div><div class="bar" style="margin:8px 0"><i style="width:${Q.i/total*100}%"></i></div>
  <div class="qmeta"><span class="chip">${q.ex?'مقالي':TYPEN[q.t]}</span><span class="chip">${DN[q.d]}</span><span class="chip">${esc(TMAP[q.tp].title.slice(0,40))}</span>${c.re?'<span class="badge b-ext">أعيد بصياغة مختلفة</span>':''}</div>
  <div class="qtext">${esc(c.text)}</div>`;
  if(q.t==='mcq'||q.t==='scen'){
    h+='<div class="opts">';
    c.perm.forEach(i=>{let cls='';if(c.answered){if(i===q.a)cls='ok';else if(c.pick===i)cls='no'}h+=`<button class="opt ${cls}" data-a="qopt" data-i="${i}" ${c.answered?'disabled':''}>${esc(q.o[i])}</button>`});
    h+='</div>';
  }else if(q.t==='tf'){
    h+='<div class="opts">';
    [true,false].forEach(v=>{let cls='';if(c.answered){if(v===q.a)cls='ok';else if(c.pick===v)cls='no'}h+=`<button class="opt ${cls}" data-a="qtf" data-v="${v}" ${c.answered?'disabled':''}>${v?'صح':'خطأ'}</button>`});
    h+='</div>';
  }else if(q.t==='fill'){
    h+=`<div class="row" style="margin:12px 0"><input type="text" id="fillIn" placeholder="اكتب إجابتك" ${c.answered?'disabled value="'+esc(c.val||'')+'"':''} autocomplete="off">${c.answered?'':'<button class="btn primary" data-a="qfill">تحقق</button>'}</div>`;
  }else if(q.t==='order'){
    h+=`<ul class="ordl">${c.ord.map((s,i)=>`<li><b>${i+1}</b><span>${esc(s)}</span>${c.answered?'':`<span class="sbtn" style="flex:none"><button class="btn sm" data-a="mv" data-i="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="أعلى">▲</button><button class="btn sm" data-a="mv" data-i="${i}" data-d="1" ${i===c.ord.length-1?'disabled':''} aria-label="أسفل">▼</button></span>`}</li>`).join('')}</ul>${c.answered?'':'<button class="btn primary" data-a="qorder">تحقق من الترتيب</button>'}`;
  }else if(q.t==='short'){
    h+=`<textarea id="shortIn" ${c.answered?'disabled':''} placeholder="اكتب إجابتك بأسلوبك" ${q.ex?'style="min-height:220px"':''}>${c.answered?esc(c.val||''):''}</textarea><div class="note"><span id="wc">${c.answered?words(c.val||''):0}</span> كلمة${q.wc?' — المطلوب في الاختبار '+q.wc+' كلمة على الأقل':''}</div>${c.answered?'':'<div style="margin-top:10px"><button class="btn primary" data-a="qshort">قيّم إجابتي</button></div>'}`;
  }
  if(c.answered)h+=feedback(c);
  h+='</div>';
  return h;
}
function feedback(c){
  const q=c.q;let h=`<div class="fb ${c.ok?'ok':'no'}"><b class="h">${c.ok?'إجابة صحيحة ✓':'إجابة غير صحيحة ✗'}</b>`;
  if(q.t==='order'&&!c.ok)h+=`<div>الترتيب الصحيح: ${q.items.map((s,i)=>`${i+1}) ${esc(s)}`).join(' ← ')}</div>`;
  if(q.t==='fill'&&!c.ok)h+=`<div>الإجابة الصحيحة: <b>${esc(q.a[0])}</b></div>`;
  if(q.t==='short'){h+=`<div>غطّيت ${c.hit} من ${q.keys.length} محاور رئيسية${q.wc?' · كتبت '+words(c.val||'')+' كلمة من '+q.wc+(words(c.val||'')<q.wc?' (أقل من المطلوب)':''):''}</div><div><b>${q.ex?'نقاط الإجابة النموذجية (وسّعها بأسلوبك إلى العدد المطلوب):':'الإجابة النموذجية:'}</b><div class="model">${esc(q.model)}</div></div>`;
    h+=`<div class="note">التصحيح تلقائي بالكلمات المفتاحية وقد يخطئ. <button class="btn sm" data-a="override">${c.ok?'أراها خاطئة':'أراها صحيحة'}</button></div>`}
  if(q.t==='tf')h+=`<div>الإجابة الصحيحة: <b>${q.a?'صح':'خطأ'}</b></div>`;
  if(q.t!=='short')h+=`<div>${esc(q.e)}</div>`;
  if((q.t==='mcq'||q.t==='scen')&&q.w){
    const items=Object.keys(q.w).filter(i=>+i!==q.a);
    if(items.length)h+=`<div style="margin-top:6px"><b>لماذا استُبعدت الخيارات الأخرى؟</b><ul style="margin:4px 0">${items.map(i=>`<li>«${esc(q.o[i])}»: ${esc(q.w[i])}</li>`).join('')}</ul></div>`;
  }
  h+=`<div class="note" style="margin-top:6px">الموضوع: ${esc(TMAP[q.tp].title)} · المصدر: ${esc(q.src)}</div></div>`;
  h+=`<div class="row" style="margin-top:12px"><button class="btn primary" data-a="qnext">${Q.i+1<Q.list.length?'السؤال التالي ←':'عرض النتيجة'}</button></div>`;
  return h;
}
function record(ok,extra){
  const c=Q.cur;c.answered=true;c.ok=ok;Object.assign(c,extra||{});
  const arr=S.ans[c.q.id]||(S.ans[c.q.id]=[]);arr.push({ok,ts:Date.now()});
  Q.res.push({qid:c.q.id,ok});save();render();
}
function quizResult(){
  const tot=Q.res.length,ok=Q.res.filter(r=>r.ok).length,pct=Math.round(ok/tot*100);
  const byT={};Q.res.forEach(r=>{const tp=QMAP[r.qid].tp;(byT[tp]=byT[tp]||{ok:0,n:0}).n++;if(r.ok)byT[tp].ok++});
  const wrong=Q.res.filter(r=>!r.ok).map(r=>QMAP[r.qid]);
  const recall=wrong.filter(q=>['fill','tf'].includes(q.t)||(q.t==='mcq'&&q.d<3)).length,apply=wrong.length-recall;
  const weakT=Object.keys(byT).filter(k=>byT[k].ok<byT[k].n).sort((a,b)=>byT[a].ok/byT[a].n-byT[b].ok/byT[b].n);
  let h=`<div class="card"><h2>نتيجة: ${esc(Q.label)}</h2><div class="big" style="color:${pct>=80?'var(--good)':pct>=50?'var(--warn)':'var(--bad)'}">${pct}%</div><p>أجبت صحيحًا عن ${ok} من ${tot}.</p>
  <h3>حسب الموضوع</h3><div class="tbl"><table class="t"><tr><th>الموضوع</th><th>الصحيح</th><th>الحالة</th></tr>${Object.keys(byT).map(k=>{const p=Math.round(byT[k].ok/byT[k].n*100);return `<tr><td>${esc(TMAP[k].title)}</td><td>${byT[k].ok}/${byT[k].n}</td><td>${p>=80?'أتقنته':p>=50?'متوسط':'يحتاج مراجعة'}</td></tr>`}).join('')}</table></div>`;
  if(wrong.length){
    h+=`<h3>تصنيف أخطائك</h3><ul><li>أخطاء في الاستدعاء والتعريفات: ${recall}</li><li>أخطاء في الفهم والتطبيق والترتيب: ${apply}</li></ul>
    <h3>راجع أولًا</h3><div class="row">${weakT.map(k=>`<button class="btn sm" data-a="learn" data-id="${k}">${esc(TMAP[k].title)}</button>`).join('')}</div>`;
  }else h+='<p>لا أخطاء في هذا الاختبار. جرّب مستوى أوسع أو الاختبار الشامل.</p>';
  h+=`<div class="row" style="margin-top:16px"><button class="btn primary" data-a="qstart" data-s="weak" data-l="اختبار نقاط الضعف">اختبار يستهدف نقاط ضعفي</button><button class="btn" data-a="qstart" data-s="retest" data-l="إعادة اختبار الأخطاء">أعد اختبار أخطائي</button><button class="btn" data-a="qmenu">قائمة الاختبارات</button></div></div>`;
  return h;
}

/* ---------- REVIEW ---------- */
function vReview(){
  const wt=weakTopics(),wq=wrongQs();
  const answered=Object.keys(S.ans).length;
  if(!answered)return `<div class="card"><h2>راجع نقاط ضعفك</h2><p>لا توجد نتائج بعد. أجب عن اختبار واحد على الأقل لتظهر تحليلات الضعف هنا.</p><button class="btn primary" data-a="qmenu">ابدأ اختبارًا</button></div>`;
  let h=`<div class="card"><h2>الموضوعات التي تحتاج مراجعة</h2>`;
  h+=wt.length?`<div class="tbl"><table class="t"><tr><th>الموضوع</th><th>الإتقان</th><th>أخطاء</th><th></th></tr>${wt.map(x=>`<tr><td>${esc(x.t.title)}</td><td>${x.s.pct==null?'يحتاج المزيد من الأسئلة':x.s.pct+'%'}</td><td>${x.s.n-x.s.ok}</td><td><button class="btn sm" data-a="learn" data-id="${x.t.id}">راجع</button> <button class="btn sm" data-a="quiztopic" data-id="${x.t.id}">اختبر</button></td></tr>`).join('')}</table></div>`:'<p>لا أخطاء حالية في آخر إجاباتك.</p>';
  h+=`<div class="row" style="margin-top:12px"><button class="btn primary" data-a="qstart" data-s="weak" data-l="اختبار نقاط الضعف">اختبار يستهدف نقاط ضعفي</button><button class="btn" data-a="qstart" data-s="retest" data-l="إعادة اختبار الأخطاء">إعادة اختبار الأخطاء (${wq.length}) بصياغة مختلفة</button></div>
  <p class="note">الأسئلة تُسحب من بنك المنهج (${QUESTIONS.length} سؤالًا) مع إعطاء الأولوية لما أخطأت فيه، وتُعاد بصياغة بديلة وخيارات مرتبة من جديد.</p></div>`;
  if(wq.length)h+=`<div class="card" style="margin-top:14px"><h3>أسئلة أخطأت فيها مؤخرًا</h3><ul>${wq.map(q=>`<li>${esc(q.q)} <span class="muted">— ${esc(TMAP[q.tp].title)}</span></li>`).join('')}</ul></div>`;
  return h;
}

/* ---------- DASHBOARD ---------- */
function vDash(){
  const done=TOPICS.filter(t=>S.studied[t.id]).length,pct=Math.round(done/TOPICS.length*100);
  const qa=Object.keys(S.ans).length;
  let h=`<div class="grid g2"><div class="card"><h3>نسبة الإنجاز في الشرح</h3><div class="big">${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div><p class="muted">أنهيت شرح ${done} من ${TOPICS.length} موضوعًا. (الدراسة لا تعني الإتقان.)</p></div>
  <div class="card"><h3>الأسئلة التي أجبت عنها</h3><div class="big">${qa}</div><p class="muted">من ${QUESTIONS.length} سؤالًا في البنك (${OBJ.length} موضوعي و${ESS.length} مقالي)</p></div></div>
  <div class="card" style="margin-top:14px"><h3>الإتقان لكل وحدة (من نتائج الاختبارات فقط)</h3>`;
  UNITS.forEach(u=>{const s=unitStat(u.id);h+=`<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><b style="color:${u.color}">الوحدة ${u.n}: ${esc(u.title)}</b><span>${s.pct==null?'غير مقاس':s.pct+'% — '+lvlN(s.pct)}</span></div><div class="bar"><i style="width:${s.pct||0}%;background:${u.color}"></i></div><span class="note">مواضيع مقاسة: ${s.measured} من ${s.of} (يلزم سؤالان على الأقل لكل موضوع)</span></div>`});
  h+='</div>';
  const wt=weakTopics().slice(0,5);
  h+=`<div class="grid g2" style="margin-top:14px"><div class="card"><h3>أكثر الموضوعات خطأً</h3>${wt.length?`<ol>${wt.map(x=>`<li>${esc(x.t.title)} — ${x.s.n-x.s.ok} خطأ</li>`).join('')}</ol>`:'<p class="muted">لا أخطاء بعد.</p>'}</div>
  <div class="card"><h3>درجات الاختبارات السابقة</h3>${S.hist.length?`<ul>${S.hist.slice(-8).reverse().map(x=>`<li>${esc(x.label)}: ${x.pct}% (${x.ok}/${x.n}) <span class="muted">${new Date(x.ts).toLocaleDateString('ar-SA')}</span></li>`).join('')}</ul>`:'<p class="muted">لم تُجرِ اختبارًا بعد.</p>'}</div></div>`;
  h+=`<div class="card" style="margin-top:14px"><h3>حفظ التقدم ونقله</h3><p class="note">${persist?'يُحفظ تقدمك تلقائيًا في هذا المتصفح فقط.':'⚠ المتصفح لا يسمح بالحفظ التلقائي هنا؛ استخدم التصدير أدناه لحفظ تقدمك.'} للانتقال إلى جهاز آخر انسخ النص وألصقه في الجهاز الآخر.</p>
  <div class="row"><button class="btn" data-a="export">تصدير التقدم (نسخ)</button><button class="btn" data-a="import">استيراد من النص</button><button class="btn" data-a="reset">تصفير التقدم</button></div>
  <textarea id="xfer" style="margin-top:10px" placeholder="هنا يظهر نص التقدم عند التصدير، أو الصق نصًا ثم اضغط استيراد"></textarea><div id="xmsg" class="note"></div></div>`;
  return h;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const nb=e.target.closest('#nav button');if(nb){setTab(nb.dataset.tab);return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  switch(a){
    case 'theme':{document.documentElement.dataset.theme=themeNow()==='dark'?'light':'dark';syncTheme();break}
    case 'expand':UNITS.forEach(u=>openUnits[u.id]=true);initMap();break;
    case 'collapse':openUnits={};initMap();break;
    case 'toggle':openUnits[id]=!openUnits[id];initMap();break;
    case 'topic':openPanel(id);break;
    case 'closepanel':closePanel();break;
    case 'learn':selTopic=id;step=0;closePanel();tab='learn';render();window.scrollTo({top:0});break;
    case 'seltopic':selTopic=id;step=0;render();break;
    case 'nexttopic':selTopic=id;step=0;render();window.scrollTo({top:0});break;
    case 'step':step=+b.dataset.i;render();break;
    case 'next':step=Math.min(6,step+1);render();break;
    case 'prev':step=Math.max(0,step-1);render();break;
    case 'chk':{const t=TMAP[selTopic],st=chkState[t.id];const i=+b.dataset.i;st.pick=i;if(i===t.chk.a){st.done='ok';S.studied[t.id]=true;S.chk[t.id]=(S.chk[t.id]||0)+1;save()}else{st.wrong++;st.done=null}render();break}
    case 'retry':{const st=chkState[selTopic];st.pick=null;st.perm=shuffle(st.perm);render();break}
    case 'quiztopic':closePanel();startQuiz(id,'اختبار: '+TMAP[id].title);break;
    case 'qmenu':Q=null;render();break;
    case 'qstart':startQuiz(b.dataset.s,b.dataset.l,{n:+b.dataset.n||10});break;
    case 'qtopicsel':{const v=$('#topicSel').value;startQuiz(v,'اختبار: '+TMAP[v].title);break}
    case 'qopt':{const i=+b.dataset.i;Q.cur.pick=i;record(i===Q.cur.q.a);break}
    case 'qtf':{const v=b.dataset.v==='true';Q.cur.pick=v;record(v===Q.cur.q.a);break}
    case 'qfill':{const v=$('#fillIn').value;if(!v.trim())break;const ok=Q.cur.q.a.some(x=>strip(x)===strip(v));record(ok,{val:v});break}
    case 'mv':{const i=+b.dataset.i,d=+b.dataset.d,o=Q.cur.ord;[o[i],o[i+d]]=[o[i+d],o[i]];render();break}
    case 'qorder':record(Q.cur.ord.join('|')===Q.cur.q.items.join('|'));break;
    case 'qshort':{const v=$('#shortIn').value;if(!v.trim())break;const nv=norm(v),q=Q.cur.q;const hit=q.keys.filter(g=>g.some(k=>{const nk=norm(k);return nk&&nv.includes(nk)})).length;record(hit/q.keys.length>=0.6,{val:v,hit});break}
    case 'override':{const c=Q.cur,arr=S.ans[c.q.id];c.ok=!c.ok;arr[arr.length-1].ok=c.ok;Q.res[Q.res.length-1].ok=c.ok;save();render();break}
    case 'qnext':{
      if(Q.i+1<Q.list.length){Q.i++;prep()}
      else{Q.done=true;const ok=Q.res.filter(r=>r.ok).length;S.hist.push({ts:Date.now(),label:Q.label,ok,n:Q.res.length,pct:Math.round(ok/Q.res.length*100)});save()}
      render();window.scrollTo({top:0});break}
    case 'export':{const x=$('#xfer');x.value=JSON.stringify(S);x.select();try{navigator.clipboard.writeText(x.value).then(()=>{$('#xmsg').textContent='تم النسخ. احفظ النص في مكان آمن.'},()=>{$('#xmsg').textContent='حدد النص وانسخه يدويًا.'})}catch(_){$('#xmsg').textContent='حدد النص وانسخه يدويًا.'}break}
    case 'import':{try{const o=JSON.parse($('#xfer').value);if(!o||typeof o!=='object'||!o.ans||!o.studied)throw 0;S=Object.assign(def(),o);save();render();setTimeout(()=>{$('#xmsg')&&($('#xmsg').textContent='تم الاستيراد بنجاح.')},0)}catch(_){$('#xmsg').textContent='النص غير صالح. تأكد من لصق نص التصدير كاملًا.'}break}
    case 'reset':{if(b.dataset.sure){S=def();chkState={};save();Q=null;render()}else{b.dataset.sure='1';b.textContent='اضغط مرة أخرى لتأكيد التصفير نهائيًا'}break}
  }
});
function themeNow(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function syncTheme(){$('#themeBtn').textContent=themeNow()==='dark'?'الوضع الفاتح':'الوضع الداكن'}
document.addEventListener('input',e=>{if(e.target.id==='shortIn'){const w=$('#wc');if(w)w.textContent=words(e.target.value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.key==='Enter'&&e.target.id==='fillIn'){const b=document.querySelector('[data-a="qfill"]');b&&b.click()}});
window.__app={S:()=>S,Q:()=>Q};
syncTheme();render();
})();
</script>
<script>try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}catch(e){}</script>
</body>
